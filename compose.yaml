# Runner fleet on hetzner-sw02-fsn1 (generated; caps total ~80% of 16vCPU/32GB).
# 3 org slots (2cpu/4g each) + repo-scoped pairs. hz-omniroute removed (repo archived).
services:
  hz-org:
    build: https://github.com/SIMPLEWISHTH/infra-gh-runner.git#master
    restart: unless-stopped
    container_name: hz-runner-org
    environment:
      RUNNER_SCOPE_URL: https://github.com/SIMPLEWISHTH
      RUNNER_NAME: hz-runner-org
      RUNNER_LABELS: ubuntu-latest
      RUNNER_TOKEN: ${HZ_ORG_TOKEN}
    cpus: "2"
    mem_limit: 4g
    volumes:
      - hz-org-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  hz-org-2:
    build: https://github.com/SIMPLEWISHTH/infra-gh-runner.git#master
