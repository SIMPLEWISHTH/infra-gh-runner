      RUNNER_NAME: hz-runner-limousine
      RUNNER_LABELS: ubuntu-latest
      RUNNER_TOKEN: ${HZ_LIMOUSINE_TOKEN}
    cpus: "0.5"
    mem_limit: 1g
    volumes: [hz-limousine-data:/data, /var/run/docker.sock:/var/run/docker.sock]

  hz-ai-plus:
    <<: *runner-base
    container_name: hz-runner-ai-plus
    environment:
      RUNNER_SCOPE_URL: https://github.com/digital-simplewish/ai-plus
      RUNNER_NAME: hz-runner-ai-plus
      RUNNER_LABELS: ubuntu-latest
      RUNNER_TOKEN: ${HZ_AI_PLUS_TOKEN}
    cpus: "0.5"
    mem_limit: 1g
    volumes: [hz-ai-plus-data:/data, /var/run/docker.sock:/var/run/docker.sock]

  hz-omniroute:
    <<: *runner-base
    container_name: hz-runner-omniroute
    environment:
      RUNNER_SCOPE_URL: https://github.com/chatchawan-simplewish/OmniRoute
      RUNNER_NAME: hz-runner-omniroute
      RUNNER_LABELS: ubuntu-latest,omni-light,omni-build
      RUNNER_TOKEN: ${HZ_OMNIROUTE_TOKEN}
    cpus: "1"
    mem_limit: 2g
    volumes: [hz-omniroute-data:/data, /var/run/docker.sock:/var/run/docker.sock]

volumes:
  runner-data:
  hz-org-data:
  hz-dreamjob-web-data:
  hz-dreamjobs-platform-data:
  hz-dreamjobs-backend-data:
  hz-dj-enrich-contract-data:
  hz-dj-enrich-runner-data:
  hz-dreamjobs-translayer-data:
  hz-portal-mini-tools-data:
  hz-phum-geo-engine-data:
  hz-limousine-data:
  hz-ai-plus-data:
  hz-omniroute-data:
